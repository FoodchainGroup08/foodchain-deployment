name: Deploy — Account 1 (Gateway + Auth + Config)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'

jobs:
  deploy:
    name: SSH Deploy to EC2 Account 1
    runs-on: ubuntu-latest
    environment: account1

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_ACCOUNT1_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_ACCOUNT1_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e

            # ── Pull latest compose files ──────────────────────────────────────
            cd ~/foodchain-deployment
            git pull origin main

            # ── Pull updated images ────────────────────────────────────────────
            docker-compose -f docker-compose.account1.yml pull

            # ── Restart services (zero-downtime order: infra first) ────────────
            docker-compose -f docker-compose.account1.yml up -d \
              --remove-orphans \
              --no-build

            # ── Quick health smoke-test ────────────────────────────────────────
            echo "Waiting 30s for services to stabilise..."
            sleep 30

            echo "=== Container status ==="
            docker-compose -f docker-compose.account1.yml ps

            echo "=== Config Server health ==="
            curl -sf http://localhost:8888/actuator/health | python3 -c "import sys,json; d=json.load(sys.stdin); print('CONFIG STATUS:', d.get('status','UNKNOWN'))"

            echo "=== Eureka health ==="
            curl -sf http://localhost:8761/actuator/health | python3 -c "import sys,json; d=json.load(sys.stdin); print('EUREKA STATUS:', d.get('status','UNKNOWN'))"

            echo "=== API Gateway health ==="
            curl -sf http://localhost:8080/actuator/health | python3 -c "import sys,json; d=json.load(sys.stdin); print('GATEWAY STATUS:', d.get('status','UNKNOWN'))"

            echo "Deploy to Account 1 complete."
