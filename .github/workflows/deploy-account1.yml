name: Deploy — Account 1 (Gateway + Auth + Config)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'

jobs:
  deploy:
    name: SSH Deploy to EC2 Account 1
    runs-on: ubuntu-latest
    environment: account1

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_ACCOUNT1_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_ACCOUNT1_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e

            # ── Pull latest compose files ──────────────────────────────────────
            cd ~/foodchain-deployment
            git fetch origin main
            git reset --hard origin/main

            # ── Pull updated images ────────────────────────────────────────────
            docker-compose -f docker-compose.account1.yml pull

            # ── Restart services (zero-downtime order: infra first) ────────────
            docker-compose -f docker-compose.account1.yml up -d \
              --remove-orphans \
              --no-build

            # ── Quick health smoke-test ────────────────────────────────────────
            echo "Waiting 60s for services to stabilise..."
            sleep 60

            echo "=== Container status ==="
            docker-compose -f docker-compose.account1.yml ps

            check_health() {
              local name=$1 url=$2
              local body
              body=$(curl -sf --max-time 5 "$url" 2>/dev/null || true)
              if [ -z "$body" ]; then
                echo "$name STATUS: not ready yet (still starting)"
              else
                echo "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); print('$name STATUS:', d.get('status','UNKNOWN'))" 2>/dev/null || echo "$name STATUS: unexpected response"
              fi
            }

            check_health "CONFIG"    http://localhost:8888/actuator/health
            check_health "EUREKA"    http://localhost:8761/actuator/health
            check_health "GATEWAY"   http://localhost:8080/actuator/health
            check_health "USER"      http://localhost:8086/api/actuator/health
            check_health "BRANCH"    http://localhost:8081/api/actuator/health
            check_health "ANALYTICS" http://localhost:8085/api/actuator/health

            echo "Deploy to Account 1 complete."
