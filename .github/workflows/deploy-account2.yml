name: Deploy — Account 2 (Business Services)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'

jobs:
  deploy:
    name: SSH Deploy to EC2 Account 2
    runs-on: ubuntu-latest
    environment: account2

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_ACCOUNT2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_ACCOUNT2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e

            # ── Pull latest compose files ──────────────────────────────────────
            cd ~/foodchain-deployment
            git pull origin main

            # ── Pull updated images ────────────────────────────────────────────
            docker-compose -f docker-compose.account2.yml pull

            # ── Restart services ───────────────────────────────────────────────
            docker-compose -f docker-compose.account2.yml up -d \
              --remove-orphans \
              --no-build

            # ── Quick health smoke-test ────────────────────────────────────────
            echo "Waiting 40s for services to stabilise..."
            sleep 40

            echo "=== Container status ==="
            docker-compose -f docker-compose.account2.yml ps

            echo "=== Order Service health ==="
            curl -sf http://localhost:8083/api/actuator/health | python3 -c "import sys,json; d=json.load(sys.stdin); print('ORDER STATUS:', d.get('status','UNKNOWN'))" || echo "Order service not ready yet"

            echo "=== Menu Service health ==="
            curl -sf http://localhost:8082/api/actuator/health | python3 -c "import sys,json; d=json.load(sys.stdin); print('MENU STATUS:', d.get('status','UNKNOWN'))" || echo "Menu service not ready yet"

            echo "Deploy to Account 2 complete."
