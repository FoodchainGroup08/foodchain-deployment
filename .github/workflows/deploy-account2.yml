name: Deploy — Account 2 (Business Services)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'

jobs:
  deploy:
    name: SSH Deploy to EC2 Account 2
    runs-on: ubuntu-latest
    environment: account2

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_ACCOUNT2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_ACCOUNT2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e

            # ── Pull latest compose files ──────────────────────────────────────
            cd ~/foodchain-deployment
            git fetch origin main
            git reset --hard origin/main

            # ── Pull updated images ────────────────────────────────────────────
            docker-compose -f docker-compose.account2.yml pull

            # ── Restart services ───────────────────────────────────────────────
            docker-compose -f docker-compose.account2.yml up -d \
              --remove-orphans \
              --no-build

            # ── Quick health smoke-test ────────────────────────────────────────
            echo "Waiting 60s for services to stabilise..."
            sleep 60

            echo "=== Container status ==="
            docker-compose -f docker-compose.account2.yml ps

            check_health() {
              local name=$1 url=$2
              local body
              body=$(curl -sf --max-time 5 "$url" 2>/dev/null || true)
              if [ -z "$body" ]; then
                echo "$name STATUS: not ready yet (still starting)"
              else
                echo "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); print('$name STATUS:', d.get('status','UNKNOWN'))" 2>/dev/null || echo "$name STATUS: unexpected response"
              fi
            }

            check_health "ORDER"         http://localhost:8083/api/actuator/health
            check_health "KITCHEN"       http://localhost:8084/api/actuator/health
            # check_health "NOTIFICATIONS" http://localhost:8087/api/actuator/health

            echo "Deploy to Account 2 complete."
