version: '3.8'

networks:
  foodchain-network:
    driver: bridge

services:

  # ── Local infrastructure (use defaults below or override in .env) ───────────

  mysql:
    image: mysql:8.0
    container_name: foodchain-mysql
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: ${RDS_PASSWORD:-root}
    # Host port only — apps inside Docker still use mysql:3306. Set MYSQL_HOST_PORT if 3306 is taken (e.g. local MySQL).
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    networks:
      - foodchain-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: foodchain-redis
    restart: on-failure
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - foodchain-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: foodchain-zookeeper
    restart: on-failure
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - foodchain-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: foodchain-kafka
    restart: on-failure
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - foodchain-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ── Spring Cloud Core ──────────────────────────────────────────────────────

  config-server:
    image: config-server:latest
    build:
      context: ../config-server
      dockerfile: Dockerfile
    container_name: config-server
    restart: on-failure
    ports:
      - "8888:8888"
    volumes:
      # Sibling repo with *.yml — no Git clone (avoids broken CONFIG_REPO_URI / private repos).
      - ../foodchain-config:/config-repo:ro
    environment:
      SPRING_PROFILES_ACTIVE: native
      # Skip Git clone — YAML is served from ../foodchain-config mounted at /config-repo.
      # Do not pass CONFIG_REPO_URI from .env here — placeholders like `your-org` break Git clone.
      # Use mounted ../foodchain-config (profile native). For Git mode, remove native + volume and add repo vars.
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: ""
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Credentials so Config Server can resolve ${...} in YAML files it serves
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_API_KEY: ${KAFKA_API_KEY:-}
      KAFKA_API_SECRET: ${KAFKA_API_SECRET:-}
      RDS_ENDPOINT: ${RDS_ENDPOINT:-mysql}
      RDS_PORT: ${RDS_PORT:-3306}
      RDS_USERNAME: ${RDS_USERNAME:-root}
      RDS_PASSWORD: ${RDS_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    networks:
      - foodchain-network
    healthcheck:
      # Liveness ignores Git composite failures while JVM is up (aggregated /health can stay 503).
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health/liveness"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

  eureka-server:
    image: eureka-server:latest
    build:
      context: ../eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    restart: on-failure
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8761:8761"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - foodchain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── API Gateway ────────────────────────────────────────────────────────────

  api-gateway:
    image: api-gateway:latest
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: on-failure
    depends_on:
      eureka-server:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - foodchain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Business Services ──────────────────────────────────────────────────────

  user-service:
    image: user-service:latest
    build:
      context: ../user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: on-failure
    depends_on:
      eureka-server:
        condition: service_healthy
    ports:
      - "8086:8086"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://${RDS_ENDPOINT}:${RDS_PORT}/user_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&socketTimeout=5000
      SPRING_DATASOURCE_USERNAME: ${RDS_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_MAIL_HOST: ${EMAIL_HOST}
      SPRING_MAIL_PORT: ${EMAIL_PORT}
      SPRING_MAIL_USERNAME: ${EMAIL_USER}
      SPRING_MAIL_PASSWORD: ${EMAIL_PASS}
      APP_MAIL_FROM: ${EMAIL_USER}
    networks:
      - foodchain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/api/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  branch-service:
    image: branch-service:latest
    build:
      context: ../branch-service
      dockerfile: Dockerfile
    container_name: branch-service
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://${RDS_ENDPOINT:-mysql}:${RDS_PORT:-3306}/branch_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&socketTimeout=5000
      SPRING_DATASOURCE_USERNAME: ${RDS_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD:-root}
    networks:
      - foodchain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  user-service:
    image: user-service:latest
    build:
      context: ../user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "${USER_SERVICE_HOST_PORT:-8086}:8086"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SERVER_PORT: "8086"
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://${RDS_ENDPOINT:-mysql}:${RDS_PORT:-3306}/user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&socketTimeout=5000
      SPRING_DATASOURCE_USERNAME: ${RDS_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      APP_KAFKA_TOPIC_EMAIL_SEND: ${KAFKA_TOPIC_EMAIL_SEND:-notification.email.send}
      APP_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    networks:
      - foodchain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/api/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  menu-service:
    image: menu-service:latest
    build:
      context: ../menu-service
      dockerfile: Dockerfile
    container_name: menu-service
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://${RDS_ENDPOINT:-mysql}:${RDS_PORT:-3306}/menu_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&socketTimeout=5000
      SPRING_DATASOURCE_USERNAME: ${RDS_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_API_KEY: ${KAFKA_API_KEY:-}
      KAFKA_API_SECRET: ${KAFKA_API_SECRET:-}
    networks:
      - foodchain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  order-service:
    image: order-service:latest
    build:
      context: ../order-service
      dockerfile: Dockerfile
    container_name: order-service
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://${RDS_ENDPOINT:-mysql}:${RDS_PORT:-3306}/order_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&socketTimeout=5000
      SPRING_DATASOURCE_USERNAME: ${RDS_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_API_KEY: ${KAFKA_API_KEY:-}
      KAFKA_API_SECRET: ${KAFKA_API_SECRET:-}
    networks:
      - foodchain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/api/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  kitchen-service:
    image: kitchen-service:latest
    build:
      context: ../kitchen-service
      dockerfile: Dockerfile
    container_name: kitchen-service
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_API_KEY: ${KAFKA_API_KEY:-}
      KAFKA_API_SECRET: ${KAFKA_API_SECRET:-}
    networks:
      - foodchain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/api/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  analytics-report-service:
    image: analytics-report-service:latest
    build:
      context: ../analytics-report-service
      dockerfile: Dockerfile
    container_name: analytics-report-service
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://${RDS_ENDPOINT:-mysql}:${RDS_PORT:-3306}/analytics_report_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&socketTimeout=5000
      SPRING_DATASOURCE_USERNAME: ${RDS_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_API_KEY: ${KAFKA_API_KEY:-}
      KAFKA_API_SECRET: ${KAFKA_API_SECRET:-}
    networks:
      - foodchain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/api/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  notifications-service:
    image: notifications-service:latest
    build:
      context: ../notifications-service
      dockerfile: Dockerfile
    container_name: notifications-service
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8087:8087"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://${RDS_ENDPOINT:-mysql}:${RDS_PORT:-3306}/notifications_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&socketTimeout=5000
      SPRING_DATASOURCE_USERNAME: ${RDS_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_API_KEY: ${KAFKA_API_KEY:-}
      KAFKA_API_SECRET: ${KAFKA_API_SECRET:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-FoodChain}
    networks:
      - foodchain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/api/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  mysql-data:
